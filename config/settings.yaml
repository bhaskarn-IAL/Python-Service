# Which units to run, and the parameters each one gets.
# Each unit is independent - no messaging between them.
# Add a new unit by registering it in core/registry.py and adding a section here.

service:
  name: "data-processing-dev"
  child_unit_prefix: "data_processing_dev"

logging:
  # Full path of the text log. The supervisor and every unit append to this one file.
  # Use forward slashes on Windows too. A relative path is taken from the app folder.
  path: "C:/S2/Random Stuffs/Python Service/logs/data-processing-dev.txt"

api:
  host: "127.0.0.1"
  port: 8000
  version: "0.1.0"

units:
  ingestion:
    enabled: true
    cfg:
      interval_seconds: 3.0

  pre_processing:
    enabled: true
    cfg:
      interval_seconds: 4.0

  processing:
    enabled: true
    cfg:
      interval_seconds: 5.0

  post_processing:
    enabled: true
    cfg:
      interval_seconds: 6.0
