[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-processing"
version = "0.1.0"
description = "Supervisor + worker-process service with FastAPI control plane"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "api*", "units*", "shared*"]
